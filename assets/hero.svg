<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-left" cx="15%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="35%" r="25%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glass-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <style>
      .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif; font-weight: 800; font-size: 56px; fill: url(#name-grad); letter-spacing: -2px; }
      .hero-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 400; font-size: 18px; fill: #60A5FA; letter-spacing: 8px; text-transform: uppercase; }
      .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 400; font-size: 15px; fill: #94A3B8; letter-spacing: 0.3px; }
      .nn-line { stroke: #1E3A5F; stroke-width: 1; opacity: 0.4; }
      .nn-node { fill: none; stroke: #3B82F6; stroke-width: 1.5; opacity: 0.35; }
      .nn-node-fill { fill: #3B82F6; opacity: 0.15; }
      .particle { fill: #60A5FA; }
      @keyframes pulse-slow { 0%,100% { opacity: 0.15; } 50% { opacity: 0.5; } }
      @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes dash-flow { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#hero-bg)"/>
  <rect width="1200" height="520" fill="url(#glow-center)"/>
  <rect width="1200" height="520" fill="url(#glow-left)"/>
  <rect width="1200" height="520" fill="url(#glow-right)"/>

  <!-- Neural Network Left -->
  <g opacity="0.5">
    <line x1="80" y1="100" x2="180" y2="180" class="nn-line" stroke-dasharray="6 4" style="animation: dash-flow 3s linear infinite;"/>
    <line x1="180" y1="180" x2="140" y2="300" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="180" y1="180" x2="300" y2="140" class="nn-line" stroke-dasharray="6 4" style="animation: dash-flow 4s linear infinite;"/>
    <line x1="300" y1="140" x2="350" y2="250" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="140" y1="300" x2="260" y2="360" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="60" y1="250" x2="140" y2="300" class="nn-line" stroke-dasharray="6 4"/>
    <circle cx="80" cy="100" r="6" class="nn-node" style="animation: pulse-slow 3s infinite;"><animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="100" r="3" class="nn-node-fill"/>
    <circle cx="180" cy="180" r="8" class="nn-node" style="animation: pulse-slow 4s infinite;"/>
    <circle cx="180" cy="180" r="4" class="nn-node-fill"/>
    <circle cx="140" cy="300" r="6" class="nn-node" style="animation: pulse-slow 3.5s infinite;"/>
    <circle cx="140" cy="300" r="3" class="nn-node-fill"/>
    <circle cx="300" cy="140" r="5" class="nn-node"/>
    <circle cx="300" cy="140" r="2.5" class="nn-node-fill"/>
    <circle cx="350" cy="250" r="4" class="nn-node" style="animation: pulse-slow 5s infinite;"/>
    <circle cx="260" cy="360" r="5" class="nn-node"/>
    <circle cx="60" cy="250" r="4" class="nn-node" style="animation: pulse-slow 4.5s infinite;"/>
  </g>

  <!-- Neural Network Right -->
  <g opacity="0.5">
    <line x1="1120" y1="120" x2="1020" y2="190" class="nn-line" stroke-dasharray="6 4" style="animation: dash-flow 3.5s linear infinite;"/>
    <line x1="1020" y1="190" x2="1060" y2="320" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="1020" y1="190" x2="900" y2="150" class="nn-line" stroke-dasharray="6 4" style="animation: dash-flow 4.5s linear infinite;"/>
    <line x1="900" y1="150" x2="860" y2="270" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="1060" y1="320" x2="940" y2="370" class="nn-line" stroke-dasharray="6 4"/>
    <line x1="1140" y1="280" x2="1060" y2="320" class="nn-line" stroke-dasharray="6 4"/>
    <circle cx="1120" cy="120" r="6" class="nn-node" style="animation: pulse-slow 3s infinite;"/>
    <circle cx="1120" cy="120" r="3" class="nn-node-fill"/>
    <circle cx="1020" cy="190" r="8" class="nn-node" style="animation: pulse-slow 4s infinite;"/>
    <circle cx="1020" cy="190" r="4" class="nn-node-fill"/>
    <circle cx="1060" cy="320" r="6" class="nn-node" style="animation: pulse-slow 3.5s infinite;"/>
    <circle cx="1060" cy="320" r="3" class="nn-node-fill"/>
    <circle cx="900" cy="150" r="5" class="nn-node"/>
    <circle cx="900" cy="150" r="2.5" class="nn-node-fill"/>
    <circle cx="860" cy="270" r="4" class="nn-node" style="animation: pulse-slow 5s infinite;"/>
    <circle cx="940" cy="370" r="5" class="nn-node"/>
    <circle cx="1140" cy="280" r="4" class="nn-node" style="animation: pulse-slow 4.5s infinite;"/>
  </g>

  <!-- Floating Particles -->
  <g>
    <circle cx="420" cy="90" r="1.5" class="particle" opacity="0.3" style="animation: pulse-slow 3s infinite;"/>
    <circle cx="780" cy="110" r="1" class="particle" opacity="0.25" style="animation: pulse-slow 4s infinite;"/>
    <circle cx="550" cy="400" r="1.5" class="particle" opacity="0.2" style="animation: pulse-slow 5s infinite;"/>
    <circle cx="650" cy="80" r="1" class="particle" opacity="0.3" style="animation: pulse-slow 3.5s infinite;"/>
    <circle cx="500" cy="130" r="1" class="particle" opacity="0.2"/>
    <circle cx="700" cy="390" r="1.5" class="particle" opacity="0.2" style="animation: pulse-slow 4.5s infinite;"/>
  </g>

  <!-- Glassmorphism Card -->
  <g style="animation: drift 12s ease-in-out infinite;">
    <rect x="280" y="80" width="640" height="280" rx="24" fill="#0F172A" opacity="0.55"/>
    <rect x="280" y="80" width="640" height="280" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Content -->
    <text x="600" y="170" text-anchor="middle" class="hero-name">KASA KRANTHI KIRAN</text>
    <text x="600" y="212" text-anchor="middle" class="hero-title">AI Engineer · Full Stack Developer</text>
    
    <!-- Accent Line -->
    <rect x="520" y="232" width="160" height="1.5" fill="url(#accent-line)" rx="1"/>
    
    <!-- Description -->
    <text x="600" y="268" text-anchor="middle" class="hero-desc">Building production-grade AI systems that solve</text>
    <text x="600" y="290" text-anchor="middle" class="hero-desc">real-world problems through intelligent software engineering.</text>
    
    <!-- Specialty Tags -->
    <g transform="translate(600, 325)" text-anchor="middle">
      <rect x="-260" y="-14" width="100" height="24" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="0.5" opacity="0.8"/>
      <text x="-210" y="4" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500" text-anchor="middle">Computer Vision</text>
      
      <rect x="-140" y="-14" width="80" height="24" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="0.5" opacity="0.8"/>
      <text x="-100" y="4" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500" text-anchor="middle">AI Systems</text>
      
      <rect x="-40" y="-14" width="80" height="24" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="0.5" opacity="0.8"/>
      <text x="0" y="4" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500" text-anchor="middle">Full Stack</text>
      
      <rect x="60" y="-14" width="80" height="24" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="0.5" opacity="0.8"/>
      <text x="100" y="4" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500" text-anchor="middle">Deep Learning</text>
      
      <rect x="160" y="-14" width="100" height="24" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="0.5" opacity="0.8"/>
      <text x="210" y="4" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500" text-anchor="middle">Cloud &amp; DevOps</text>
    </g>
  </g>

  <!-- Bottom Curve -->
  <path d="M 0 480 Q 600 430 1200 480 L 1200 520 L 0 520 Z" fill="#020617" opacity="0.6"/>
  <path d="M 0 495 Q 600 450 1200 495 L 1200 520 L 0 520 Z" fill="#0F172A" opacity="0.3"/>
</svg>
