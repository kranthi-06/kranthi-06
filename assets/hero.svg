<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="text-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 72px; fill: url(#text-primary); letter-spacing: -2px; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 500; font-size: 20px; fill: #60A5FA; letter-spacing: 4px; text-transform: uppercase; }
      .sub { font-family: monospace; font-size: 14px; fill: #64748B; }
      .glass { fill: rgba(15, 23, 42, 0.4); stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; backdrop-filter: blur(20px); }
      .particle { fill: #3B82F6; }
      .line { stroke: #1E293B; stroke-width: 1; stroke-dasharray: 4 4; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>
  <circle cx="600" cy="200" r="400" fill="url(#glow)"/>
  
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#1E293B"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <g opacity="0.4">
    <line x1="200" y1="100" x2="350" y2="180" class="line"/>
    <line x1="350" y1="180" x2="280" y2="300" class="line"/>
    <line x1="1000" y1="120" x2="850" y2="160" class="line"/>
    <line x1="850" y1="160" x2="920" y2="280" class="line"/>
    <circle cx="200" cy="100" r="3" class="particle" style="animation: pulse 2s infinite alternate;"/>
    <circle cx="350" cy="180" r="4" class="particle" style="animation: pulse 3s infinite alternate;"/>
    <circle cx="280" cy="300" r="3" class="particle" style="animation: pulse 2.5s infinite alternate;"/>
    <circle cx="1000" cy="120" r="3" class="particle" style="animation: pulse 2s infinite alternate;"/>
    <circle cx="850" cy="160" r="4" class="particle" style="animation: pulse 3s infinite alternate;"/>
    <circle cx="920" cy="280" r="3" class="particle" style="animation: pulse 2.5s infinite alternate;"/>
  </g>

  <g style="animation: float 8s ease-in-out infinite;">
    <rect x="300" y="80" width="600" height="240" rx="20" class="glass"/>
    <text x="600" y="170" text-anchor="middle" class="name" style="font-size: 52px;">KASA KRANTHI KIRAN</text>
    <text x="600" y="215" text-anchor="middle" class="role">AI Engineer &amp; Full Stack Developer</text>
    <rect x="580" y="240" width="40" height="2" fill="#3B82F6" rx="1"/>
    <text x="600" y="280" text-anchor="middle" class="sub">&lt;sys.stdout.write("Building the future") /&gt;</text>
  </g>
</svg>
