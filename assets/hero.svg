<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="text-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-primary); letter-spacing: -1px; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 400; font-size: 20px; fill: #60A5FA; letter-spacing: 6px; text-transform: uppercase; }
      .particle { fill: #3B82F6; }
      .line { stroke: #1E293B; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .node { fill: #2563EB; stroke: #60A5FA; stroke-width: 2; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.2; }
        100% { opacity: 0.8; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
    </style>
  </defs>

  <path d="M 0 0 L 1200 0 L 1200 380 Q 600 500 0 380 Z" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="450" fill="url(#glow)"/>

  <g opacity="0.6">
    <line x1="200" y1="120" x2="350" y2="200" class="line" style="animation: dash 2s linear infinite;"/>
    <line x1="350" y1="200" x2="280" y2="350" class="line"/>
    <line x1="350" y1="200" x2="500" y2="150" class="line"/>
    <line x1="1000" y1="140" x2="850" y2="180" class="line"/>
    <line x1="850" y1="180" x2="920" y2="320" class="line"/>
    <line x1="850" y1="180" x2="700" y2="160" class="line"/>
    
    <circle cx="200" cy="120" r="5" class="node" style="animation: pulse 2s infinite alternate;"/>
    <circle cx="350" cy="200" r="7" class="node" style="animation: pulse 3s infinite alternate;"/>
    <circle cx="280" cy="350" r="5" class="node" style="animation: pulse 2.5s infinite alternate;"/>
    <circle cx="500" cy="150" r="4" class="node"/>
    
    <circle cx="1000" cy="140" r="5" class="node" style="animation: pulse 2s infinite alternate;"/>
    <circle cx="850" cy="180" r="7" class="node" style="animation: pulse 3s infinite alternate;"/>
    <circle cx="920" cy="320" r="5" class="node" style="animation: pulse 2.5s infinite alternate;"/>
    <circle cx="700" cy="160" r="4" class="node"/>
  </g>

  <g style="animation: float 8s ease-in-out infinite;">
    <rect x="250" y="100" width="700" height="200" rx="20" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" style="backdrop-filter: blur(24px);"/>
    <text x="600" y="190" text-anchor="middle" class="name">KASA KRANTHI KIRAN</text>
    <text x="600" y="240" text-anchor="middle" class="role">AI Engineer &amp; Full Stack Developer</text>
    <rect x="580" y="270" width="40" height="2" fill="#3B82F6" rx="1"/>
  </g>
</svg>
