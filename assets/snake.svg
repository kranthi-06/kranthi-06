<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="snake-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1000" height="200" fill="url(#grid-grad)" rx="15"/>
  
  <pattern id="squares" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect x="2" y="2" width="16" height="16" fill="#1E293B" rx="2" opacity="0.3"/>
  </pattern>
  <rect width="1000" height="200" fill="url(#squares)" rx="15"/>

  <g opacity="0.8">
    <rect x="102" y="22" width="16" height="16" fill="#1D4ED8" rx="2"/>
    <rect x="122" y="42" width="16" height="16" fill="#3B82F6" rx="2"/>
    <rect x="122" y="62" width="16" height="16" fill="#60A5FA" rx="2"/>
    <rect x="142" y="82" width="16" height="16" fill="#3B82F6" rx="2"/>
    <rect x="162" y="82" width="16" height="16" fill="#1D4ED8" rx="2"/>
    <rect x="182" y="102" width="16" height="16" fill="#2563EB" rx="2"/>
    
    <rect x="402" y="42" width="16" height="16" fill="#60A5FA" rx="2"/>
    <rect x="422" y="62" width="16" height="16" fill="#3B82F6" rx="2"/>
    <rect x="442" y="82" width="16" height="16" fill="#2563EB" rx="2"/>
    
    <rect x="702" y="122" width="16" height="16" fill="#1D4ED8" rx="2"/>
    <rect x="722" y="142" width="16" height="16" fill="#2563EB" rx="2"/>
    <rect x="742" y="122" width="16" height="16" fill="#60A5FA" rx="2"/>
  </g>

  <path d="M 110 30 L 130 50 L 130 70 L 150 90 L 170 90 L 190 110 L 410 50 L 430 70 L 450 90 L 710 130 L 730 150 L 750 130" 
        fill="none" stroke="url(#snake-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <circle cx="750" cy="130" r="4" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
