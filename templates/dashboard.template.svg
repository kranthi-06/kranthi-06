<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #FFFFFF; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 500; font-size: 13px; fill: #64748B; text-transform: uppercase; letter-spacing: 1px;}
      .value { font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 600; font-size: 28px; fill: #60A5FA; }
      .text-value { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #F8FAFC; }
      .card { fill: rgba(30, 41, 59, 0.4); stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; rx: 12; }
    </style>
  </defs>
  
  <rect width="1000" height="450" rx="20" fill="url(#bg)"/>
  
  <text x="50" y="50" class="title">ENGINEERING DASHBOARD</text>
  <text x="950" y="50" text-anchor="end" class="label" fill="#3B82F6">LIVE - {{ date }}</text>

  <!-- Row 1 -->
  <g transform="translate(50, 80)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">GitHub Since</text>
    <text x="20" y="75" class="value">{{ gh.github_since }}</text>
  </g>
  
  <g transform="translate(285, 80)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">Days Active</text>
    <text x="20" y="75" class="value">{{ gh.days_on_github }}</text>
  </g>

  <g transform="translate(520, 80)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">Repositories</text>
    <text x="20" y="75" class="value">{{ gh.public_repos }}</text>
  </g>

  <g transform="translate(755, 80)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">Total Commits</text>
    <text x="20" y="75" class="value">{{ gh.total_commits }}</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(50, 205)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">Commits This Week</text>
    <text x="20" y="75" class="value">{{ gh.commits_this_week }}</text>
  </g>

  <g transform="translate(285, 205)">
    <rect width="210" height="100" class="card"/>
    <text x="20" y="35" class="label">Deployments Online</text>
    <text x="20" y="75" class="value">{{ online_deployments }}</text>
  </g>

  <g transform="translate(520, 205)">
    <rect width="445" height="100" class="card"/>
    <text x="20" y="35" class="label">Current Focus</text>
    <text x="20" y="75" class="text-value" style="font-size: 20px;">{{ current_focus }}</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(50, 330)">
    <rect width="325" height="90" class="card"/>
    <text x="20" y="35" class="label">Latest Repository</text>
    <text x="20" y="70" class="text-value" style="fill: #94A3B8;">{{ gh.latest_repo }}</text>
  </g>

  <g transform="translate(400, 330)">
    <rect width="565" height="90" class="card"/>
    <text x="20" y="35" class="label">Latest Commit</text>
    <text x="20" y="70" class="text-value" style="font-family: 'SF Mono', monospace; font-weight: 400; fill: #CBD5E1;">{{ gh.latest_commit }}</text>
  </g>
</svg>
